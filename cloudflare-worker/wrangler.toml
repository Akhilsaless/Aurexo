name = "aurexo-backend"
preview_urls = false
main = "src/runtime.js"
compatibility_date = "2026-08-01"
[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = true
[[durable_objects.bindings]]
name = "STUDIO"
class_name = "StudioRuntime"
[[migrations]]
tag = "v1-studio"
new_sqlite_classes = ["StudioRuntime"]
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "aurexo-media"
[observability]
enabled = true

[vars]
AUREXO_OWNER_EMAIL = "akhil.khali.111@gmail.com"
