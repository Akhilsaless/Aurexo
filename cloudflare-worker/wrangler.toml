name = "aurexo-backend"
main = "src/studio.js"
compatibility_date = "2026-08-01"

[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = true

# Same-origin requests are accepted by default. Set AUREXO_ALLOWED_ORIGIN
# only when using a separate API origin on the same site.

[[kv_namespaces]]
binding = "AUREXO_KV"
