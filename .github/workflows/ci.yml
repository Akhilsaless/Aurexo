name: Validate Studio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify:runtime
      - run: npx wrangler deploy --dry-run --config cloudflare-worker/wrangler.toml
        env:
          WRANGLER_SEND_METRICS: "false"
